<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>星際記憶翻牌</title>
<style>
:root{
  --night:#0b1026; --panel:#171f45; --edge:#2c3870;
  --gold:#f2c14e; --mint:#7ee0d1; --text:#e8ecff; --muted:#9aa5d6;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  background:radial-gradient(ellipse at 20% 0%,#1d2a66 0%,var(--night) 55%) fixed;
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  display:flex;justify-content:center;padding:20px 14px 40px;
}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0;
  background-image:
   radial-gradient(1.5px 1.5px at 12% 18%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 33% 72%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 58% 30%,#cfe 50%,transparent 51%),
   radial-gradient(1px 1px at 77% 62%,#fff 50%,transparent 51%),
   radial-gradient(1.5px 1.5px at 90% 14%,#fff 50%,transparent 51%),
   radial-gradient(1px 1px at 45% 90%,#fff 50%,transparent 51%);
  opacity:.8}
main{position:relative;z-index:1;width:100%;max-width:560px;text-align:center}
h1{font-size:clamp(28px,7vw,40px);margin:8px 0 6px;letter-spacing:.08em;color:var(--gold)}
.sub{color:var(--muted);margin:0 0 24px}
.hidden{display:none!important}

/* 難度選擇 */
.levels{display:grid;gap:12px;margin:0 auto;max-width:340px}
.level{
  background:var(--panel);border:2px solid var(--edge);color:var(--text);
  border-radius:14px;padding:16px 18px;font:inherit;cursor:pointer;text-align:left;
  display:flex;justify-content:space-between;align-items:center;
  transition:border-color .15s,transform .15s;
}
.level:hover,.level:focus-visible{border-color:var(--gold);transform:translateY(-2px);outline:none}
.level b{font-size:20px}
.level span{color:var(--muted);font-size:14px}

/* 狀態列 */
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 14px;min-width:88px}
.stat small{display:block;color:var(--muted);font-size:12px}
.stat strong{font-size:20px;color:var(--mint);font-variant-numeric:tabular-nums}
.ghost{background:none;border:1px solid var(--edge);color:var(--muted);border-radius:10px;
  padding:10px 14px;font:inherit;cursor:pointer}
.ghost:hover,.ghost:focus-visible{color:var(--text);border-color:var(--muted);outline:none}

/* 牌桌 */
.board{display:grid;gap:10px;margin:0 auto;width:100%}
.card{
  aspect-ratio:1/1;perspective:600px;background:none;border:0;padding:0;cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .45s}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:12px;backface-visibility:hidden;
  display:flex;align-items:center;justify-content:center}
.back{
  background:radial-gradient(circle at 50% 50%,#2a3a86 0,#1a2352 70%);
  border:2px solid var(--edge);color:var(--gold);font-size:clamp(18px,5vw,28px);
}
.front{
  transform:rotateY(180deg);background:#f4f6ff;border:2px solid var(--mint);
  font-size:clamp(28px,9vw,48px);
}
.card.done .front{background:#d9fff8;border-color:var(--gold)}
.card:focus-visible .back{border-color:var(--gold)}

/* 勝利畫面 */
.win{position:fixed;inset:0;z-index:5;background:rgba(5,8,22,.82);
  display:flex;align-items:center;justify-content:center;padding:20px}
.win .box{background:var(--panel);border:2px solid var(--gold);border-radius:18px;
  padding:28px 24px;max-width:340px;width:100%}
.win h2{margin:0 0 8px;color:var(--gold);font-size:26px}
.win p{margin:6px 0;color:var(--text)}
.win .row{display:flex;gap:10px;justify-content:center;margin-top:20px;flex-wrap:wrap}
.primary{background:var(--gold);color:#1a1530;border:0;border-radius:10px;padding:12px 20px;
  font:inherit;font-weight:700;cursor:pointer}
.primary:focus-visible{outline:3px solid var(--mint)}

/* v0.2 背景：星星閃爍、星雲、流星 */
.stars{animation:twinkle 4s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.45}to{opacity:.95}}
.nebula{position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
   radial-gradient(circle at 85% 80%,rgba(126,224,209,.14),transparent 42%),
   radial-gradient(circle at 8% 62%,rgba(242,193,78,.09),transparent 40%)}
.shoot{position:fixed;top:10%;left:-12%;width:100px;height:2px;z-index:0;pointer-events:none;
  background:linear-gradient(90deg,transparent,#fff);opacity:0;
  animation:shoot 10s linear infinite 3s}
@keyframes shoot{
  0%{transform:translate(0,0) rotate(25deg);opacity:0}
  2%{opacity:1}
  12%{transform:translate(125vw,58vh) rotate(25deg);opacity:0}
  100%{transform:translate(125vw,58vh) rotate(25deg);opacity:0}}

/* v0.2 配對特效 */
.card.done .front{animation:pop .55s ease-out}
@keyframes pop{
  0%{transform:rotateY(180deg) scale(1)}
  45%{transform:rotateY(180deg) scale(1.14);box-shadow:0 0 22px 6px rgba(242,193,78,.75)}
  100%{transform:rotateY(180deg) scale(1)}}

/* v0.2 勝利：星級與掉落星星 */
.rating{font-size:42px;letter-spacing:6px;margin:8px 0 4px}
.rating span{display:inline-block;color:#3a4478;animation:starIn .5s both}
.rating span.on{color:var(--gold);text-shadow:0 0 14px rgba(242,193,78,.7)}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:scale(1) rotate(0)}}
.best{color:var(--mint)}
.rule{margin:-6px 0 14px;color:var(--muted);font-size:13px}
.win .rule{margin:10px 0 0}
.fx{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.fx span{position:absolute;top:-40px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}

@media (prefers-reduced-motion:reduce){
  .inner,.level{transition:none}
  .stars,.shoot,.card.done .front,.rating span{animation:none!important}
  .fx{display:none}
}
</style>
</head>
<body>
<div class="stars" aria-hidden="true"></div>
<div class="nebula" aria-hidden="true"></div>
<div class="shoot" aria-hidden="true"></div>
<div class="fx" id="fx" aria-hidden="true"></div>
<main>
  <h1>星際記憶翻牌</h1>

  <!-- 難度選擇 -->
  <section id="menu">
    <p class="sub">翻開兩張牌，找出所有相同的太空夥伴。選一個難度開始。</p>
    <div class="levels">
      <button class="level" data-cols="4" data-pairs="6"><b>簡單</b><span>4 × 3 ・ 6 對</span></button>
      <button class="level" data-cols="4" data-pairs="8"><b>普通</b><span>4 × 4 ・ 8 對</span></button>
      <button class="level" data-cols="4" data-pairs="12"><b>困難</b><span>4 × 6 ・ 12 對</span></button>
    </div>
  </section>

  <!-- 遊戲畫面 -->
  <section id="game" class="hidden">
    <div class="bar">
      <div class="stat"><small>步數</small><strong id="moves">0</strong></div>
      <div class="stat"><small>時間</small><strong id="time">0:00</strong></div>
      <button class="ghost" id="back">換難度</button>
    </div>
    <p class="rule" id="rule"></p>
    <div class="board" id="board"></div>
  </section>
</main>

<!-- 勝利畫面 -->
<div class="win hidden" id="win" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="box">
    <h2 id="winTitle">任務完成！</h2>
    <div class="rating" id="rating"></div>
    <p id="winText"></p>
    <p class="best" id="bestText"></p>
    <p class="rule" id="ruleWin"></p>
    <div class="row">
      <button class="primary" id="again">再玩一次</button>
      <button class="ghost" id="share">分享成績</button>
      <button class="ghost" id="menuBtn">換難度</button>
    </div>
  </div>
</div>

<script>
const SYMBOLS = ["🪐","🚀","👽","☄️","🌙","⭐","🛸","🌍","🌞","🛰️","👨‍🚀","🌌"];
const $ = id => document.getElementById(id);
const menu=$("menu"), game=$("game"), board=$("board"), winBox=$("win");

let pairs=0, cols=4, first=null, lock=false, moves=0, matched=0;
let timer=null, seconds=0, started=false;

function shuffle(a){
  for(let i=a.length-1;i>0;i--){
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function fmt(s){ return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function stopTimer(){ clearInterval(timer); timer=null; }
function startTimer(){
  if(started) return;
  started=true;
  timer=setInterval(()=>{ seconds++; $("time").textContent=fmt(seconds); },1000);
}

function start(p,c){
  pairs=p; cols=c;
  stopTimer();
  first=null; lock=false; moves=0; matched=0; seconds=0; started=false;
  $("moves").textContent="0"; $("time").textContent="0:00";
  $("rule").textContent=ruleText();
  winBox.classList.add("hidden"); $("fx").innerHTML="";
  menu.classList.add("hidden"); game.classList.remove("hidden");

  const deck = shuffle([...SYMBOLS.slice(0,pairs),...SYMBOLS.slice(0,pairs)]);
  board.style.gridTemplateColumns=`repeat(${cols},1fr)`;
  // 困難模式牌較多，限制寬度讓牌不會太大
  board.style.maxWidth = pairs>8 ? "420px" : "460px";
  board.innerHTML="";
  deck.forEach(sym=>{
    const b=document.createElement("button");
    b.className="card"; b.dataset.sym=sym;
    b.setAttribute("aria-label","未翻開的牌");
    b.innerHTML=`<div class="inner"><div class="face back">✦</div><div class="face front">${sym}</div></div>`;
    b.addEventListener("click",()=>flip(b));
    board.appendChild(b);
  });
}

function flip(card){
  if(lock || card.classList.contains("open") || card.classList.contains("done")) return;
  startTimer();
  card.classList.add("open");
  card.setAttribute("aria-label","已翻開 "+card.dataset.sym);
  if(!first){ first=card; return; }

  moves++; $("moves").textContent=moves;
  if(first.dataset.sym===card.dataset.sym){
    first.classList.replace("open","done");
    card.classList.replace("open","done");
    first=null; matched++;
    if(matched===pairs) setTimeout(win,600);
  } else {
    lock=true;
    const a=first; first=null;
    setTimeout(()=>{
      a.classList.remove("open"); card.classList.remove("open");
      a.setAttribute("aria-label","未翻開的牌");
      card.setAttribute("aria-label","未翻開的牌");
      lock=false;
    },850);
  }
}

const T3=2, T2=3; // 3 星：步數 ≤ 對數×2；2 星：步數 ≤ 對數×3
function ruleText(){
  return `星級標準：★★★ ${pairs*T3} 步內 ・ ★★ ${pairs*T2} 步內 ・ ★ 其他`;
}
function rate(){
  if(moves<=pairs*T3) return 3;
  if(moves<=pairs*T2) return 2;
  return 1;
}
function loadBest(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } }
function saveBest(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} }

function confetti(){
  const fx=$("fx"); fx.innerHTML="";
  const icons=["⭐","✦","✨","🌟"];
  for(let i=0;i<36;i++){
    const el=document.createElement("span");
    el.textContent=icons[i%icons.length];
    el.style.left=Math.random()*100+"%";
    el.style.fontSize=(14+Math.random()*20)+"px";
    el.style.animationDuration=(2.5+Math.random()*2)+"s";
    el.style.animationDelay=(Math.random()*1.2)+"s";
    fx.appendChild(el);
  }
  setTimeout(()=>{ fx.innerHTML=""; },6000);
}

function win(){
  stopTimer();
  const n=rate();
  $("rating").setAttribute("aria-label",n+" 顆星");
  $("rating").innerHTML=[1,2,3].map(i=>`<span class="${i<=n?"on":""}" style="animation-delay:${i*0.25}s">★</span>`).join("");
  const key="space-memory-best-"+pairs;
  const old=loadBest(key);
  const best={
    moves:Math.min(moves,old?old.moves:Infinity),
    time:Math.min(seconds,old?old.time:Infinity)
  };
  const broke=old&&(moves<old.moves||seconds<old.time);
  saveBest(key,best);
  $("bestText").textContent=(broke?"新紀錄！":"")+`最佳：${best.moves} 步 ・ ${fmt(best.time)}`;
  $("ruleWin").textContent=ruleText();
  confetti();
  $("winText").textContent=`你用了 ${moves} 步、${fmt(seconds)} 完成。`;
  winBox.classList.remove("hidden");
  $("again").focus();
}

function toMenu(){
  stopTimer(); $("fx").innerHTML="";
  winBox.classList.add("hidden");
  game.classList.add("hidden"); menu.classList.remove("hidden");
}

const LEVEL_NAME={6:"簡單",8:"普通",12:"困難"};

function shareCard(){
  const n=rate(), c=document.createElement("canvas");
  c.width=720; c.height=480;
  const g=c.getContext("2d"), f='"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif';
  const bg=g.createLinearGradient(0,0,720,480);
  bg.addColorStop(0,"#1d2a66"); bg.addColorStop(1,"#0b1026");
  g.fillStyle=bg; g.fillRect(0,0,720,480);
  for(let i=0;i<70;i++){
    g.fillStyle="rgba(255,255,255,"+(0.3+Math.random()*0.6)+")";
    g.beginPath(); g.arc(Math.random()*720,Math.random()*480,Math.random()*1.8+0.4,0,Math.PI*2); g.fill();
  }
  g.textAlign="center";
  g.fillStyle="#f2c14e"; g.font="bold 44px "+f; g.fillText("星際記憶翻牌",360,90);
  g.font="bold 76px "+f; g.fillText("★".repeat(n)+"☆".repeat(3-n),360,205);
  g.fillStyle="#e8ecff"; g.font="32px "+f;
  g.fillText(`${LEVEL_NAME[pairs]} ・ ${moves} 步 ・ ${fmt(seconds)}`,360,285);
  g.fillStyle="#7ee0d1"; g.font="26px "+f; g.fillText($("bestText").textContent,360,345);
  g.fillStyle="#9aa5d6"; g.font="26px "+f; g.fillText("🪐 🚀 👽 ☄️ 🌙 ⭐",360,425);
  return c;
}

async function share(){
  const btn=$("share");
  const blob=await new Promise(r=>shareCard().toBlob(r,"image/png"));
  const file=new File([blob],"space-memory.png",{type:"image/png"});
  try{
    if(navigator.canShare && navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"星際記憶翻牌",text:"我在星際記憶翻牌的成績！"});
      return;
    }
  }catch(e){ if(e.name==="AbortError") return; }
  // 不支援分享時，改為下載圖片
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob); a.download="星際記憶翻牌成績.png"; a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
  btn.textContent="已下載圖片";
  setTimeout(()=>{ btn.textContent="分享成績"; },2000);
}

document.querySelectorAll(".level").forEach(btn=>{
  btn.addEventListener("click",()=>start(+btn.dataset.pairs,+btn.dataset.cols));
});
$("back").addEventListener("click",toMenu);
$("share").addEventListener("click",share);
$("menuBtn").addEventListener("click",toMenu);
$("again").addEventListener("click",()=>start(pairs,cols));
</script>
</body>
</html>
